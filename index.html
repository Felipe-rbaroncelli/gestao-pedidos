<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linha — Gestão de Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#16181D; --paper:#FAFAF8; --amber:#E8A33D; --amber-dk:#C6832A; --green:#3F8F6D; --slate:#6B7280; --line:#E4E1DA; }
  *{box-sizing:border-box;} body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .disp{font-family:'Space Grotesk',sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#D8D4CB;border-radius:4px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;}
  .btn-primary{background:var(--ink);color:#fff;} .btn-primary:hover{background:#000;}
  .btn-amber{background:var(--amber);color:#1A1300;} .btn-amber:hover{background:var(--amber-dk);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px;}
  .tag{font-size:11px;letter-spacing:.02em;padding:3px 9px;border-radius:999px;font-weight:600;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect} = React;

/* =========================================================================
   CONFIGURAÇÃO DO BANCO ONLINE (Supabase)
   Preencha as duas linhas abaixo com os dados do seu projeto Supabase para
   que os pedidos fiquem salvos num banco de dados real (funciona hospedado
   no GitHub Pages, acessível de qualquer computador/celular).
   Deixe em branco para continuar usando o modo local (localStorage, só
   funciona no navegador deste computador).
   ========================================================================= */
const SUPABASE_URL = "";        // ex: https://xxxxxxxx.supabase.co
const SUPABASE_ANON_KEY = "";   // sua "anon public key"

const useCloud = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = useCloud ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2,10));
const money = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const now = () => new Date().toISOString();
const fmtDate = iso => new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

const STATUSES = ["Pendente","Em Produção","Concluído","Entregue"];
const STATUS_STYLE = {
  "Pendente":"bg-[#FBEFD9] text-[#8A5A00]",
  "Em Produção":"bg-[#E3ECFB] text-[#1D4ED8]",
  "Concluído":"bg-[#E1F3EA] text-[#0F7A48]",
  "Entregue":"bg-[#EAE7FB] text-[#5B3EC9]",
};

/* -------- camada de dados: local (localStorage) ou nuvem (Supabase) -------- */
const LOCAL_KEY = "lp_db_v3";
function seedData(){
  return {
    users:[{id:uid(),username:"70243641656",password:"Fb@14311",role:"admin",name:"Felipe (Dono)"}],
    products:[
      {id:uid(),name:"Vaso Geométrico M",sku:"VAS-001",description:"Vaso decorativo impresso em PLA",price:59.9,category:"Decoração",stock:10},
      {id:uid(),name:"Chaveiro Manna A2",sku:"CHV-A2",description:"Chaveiro personalizado da marca",price:14.9,category:"Brindes",stock:50},
    ],
    orders:[],
  };
}

const LocalStore = {
  async loadAll(){
    const raw = localStorage.getItem(LOCAL_KEY);
    const db = raw ? JSON.parse(raw) : seedData();
    if(!raw) localStorage.setItem(LOCAL_KEY, JSON.stringify(db));
    return db;
  },
  async _save(db){ localStorage.setItem(LOCAL_KEY, JSON.stringify(db)); return db; },
  async addProduct(p){ const db=await this.loadAll(); db.products.push({...p,id:uid(),stock:Number(p.stock)||0}); return this._save(db); },
  async updateProduct(p){ const db=await this.loadAll(); db.products=db.products.map(x=>x.id===p.id?{...p}:x); return this._save(db); },
  async deleteProduct(id){ const db=await this.loadAll(); db.products=db.products.filter(x=>x.id!==id); return this._save(db); },
  async addUser(u){ const db=await this.loadAll(); db.users.push({...u,id:uid(),role:'vendedor'}); return this._save(db); },
  async updateUser(u){ const db=await this.loadAll(); db.users=db.users.map(x=>x.id===u.id?{...x,...u}:x); return this._save(db); },
  async deleteUser(id){ const db=await this.loadAll(); db.users=db.users.filter(x=>x.id!==id); return this._save(db); },
  async addOrder(o){ const db=await this.loadAll(); db.orders.push({...o,id:uid()}); return this._save(db); },
  async updateOrderStatus(id,status){ const db=await this.loadAll(); db.orders=db.orders.map(x=>x.id===id?{...x,status}:x); return this._save(db); },
};

const CloudStore = {
  async loadAll(){
    const [{data:users,error:e1},{data:products,error:e2},{data:orders,error:e3}] = await Promise.all([
      sb.from('users').select('*'),
      sb.from('products').select('*'),
      sb.from('orders').select('*').order('createdAt',{ascending:true}),
    ]);
    if(e1||e2||e3) console.error(e1||e2||e3);
    return {users:users||[], products:products||[], orders:orders||[]};
  },
  async addProduct(p){ await sb.from('products').insert([{...p,stock:Number(p.stock)||0}]); return this.loadAll(); },
  async updateProduct(p){ const {id,...rest}=p; await sb.from('products').update(rest).eq('id',id); return this.loadAll(); },
  async deleteProduct(id){ await sb.from('products').delete().eq('id',id); return this.loadAll(); },
  async addUser(u){ await sb.from('users').insert([{...u,role:'vendedor'}]); return this.loadAll(); },
  async updateUser(u){ const {id,...rest}=u; await sb.from('users').update(rest).eq('id',id); return this.loadAll(); },
  async deleteUser(id){ await sb.from('users').delete().eq('id',id); return this.loadAll(); },
  async addOrder(o){ await sb.from('orders').insert([o]); return this.loadAll(); },
  async updateOrderStatus(id,status){ await sb.from('orders').update({status}).eq('id',id); return this.loadAll(); },
};

const Store = useCloud ? CloudStore : LocalStore;

function Field({label,children}){
  return <label className="block mb-3"><span className="block text-sm font-medium text-[#3A3A38] mb-1">{label}</span>{children}</label>;
}
const inputCls = "w-full border border-[#D8D4CB] rounded-lg px-3 py-2 text-sm bg-white";

function StatusTag({s}){ return <span className={"tag "+STATUS_STYLE[s]}>{s}</span>; }

function Modal({title,onClose,children}){
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
      <div className="card w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between px-5 py-4 border-b border-[var(--line)]">
          <h3 className="disp font-semibold text-lg">{title}</h3>
          <button onClick={onClose} className="text-[#8A8680] hover:text-black text-xl leading-none">×</button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

function Login({users,onLogin}){
  const [u,setU]=useState(""); const [p,setP]=useState(""); const [err,setErr]=useState("");
  const submit = e => {
    e.preventDefault();
    const found = users.find(x=>x.username.trim()===u.trim() && x.password.trim()===p.trim());
    if(!found){ setErr("Usuário ou senha inválidos."); return; }
    onLogin(found);
  };
  return (
    <div className="min-h-screen flex items-center justify-center px-4" style={{background:"var(--ink)"}}>
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="inline-flex items-center gap-2 text-white disp text-2xl font-bold"><span style={{color:"var(--amber)"}}>●</span> Linha</div>
          <p className="text-[#9A968D] text-sm mt-1">Gestão de pedidos de fabricação</p>
          {!useCloud && <p className="text-[#7A766D] text-xs mt-2">Modo local — os dados ficam salvos apenas neste navegador.</p>}
        </div>
        <form onSubmit={submit} className="card p-6">
          <Field label="Usuário"><input className={inputCls} value={u} onChange={e=>setU(e.target.value)} autoFocus/></Field>
          <Field label="Senha"><input type="password" className={inputCls} value={p} onChange={e=>setP(e.target.value)}/></Field>
          {err && <p className="text-sm text-red-600 mb-3">{err}</p>}
          <button className="btn-amber w-full rounded-lg py-2.5 text-sm font-semibold">Entrar</button>
        </form>
      </div>
    </div>
  );
}

function Shell({user,tabs,active,setActive,onLogout,children}){
  const [open,setOpen]=useState(false);
  return (
    <div className="min-h-screen flex flex-col md:flex-row">
      <aside className="md:w-60 shrink-0 text-white flex md:flex-col justify-between" style={{background:"var(--ink)"}}>
        <div className="px-5 py-4 flex items-center justify-between md:block">
          <div className="disp font-bold text-lg flex items-center gap-2"><span style={{color:"var(--amber)"}}>●</span> Linha</div>
          <button className="md:hidden text-white" onClick={()=>setOpen(!open)}>☰</button>
        </div>
        <nav className={(open?"flex":"hidden")+" md:flex flex-col gap-1 px-3 pb-4 md:pb-0 md:flex-1"}>
          {tabs.map(t=>(
            <button key={t.key} onClick={()=>{setActive(t.key);setOpen(false);}}
              className={"text-left px-3 py-2 rounded-lg text-sm font-medium "+(active===t.key?"bg-white/10 text-white":"text-[#A9A59B] hover:text-white")}>
              {t.label}
            </button>
          ))}
        </nav>
        <div className="px-5 py-4 border-t border-white/10 hidden md:block">
          <p className="text-sm text-white">{user.name}</p>
          <p className="text-xs text-[#8A867C] mb-2">{user.role==='admin'?'Administrador':'Vendedor'}</p>
          <button onClick={onLogout} className="text-xs text-[#C9AF7A] hover:text-[var(--amber)]">Sair</button>
        </div>
      </aside>
      <main className="flex-1 p-4 md:p-8 max-w-6xl w-full mx-auto">{children}</main>
    </div>
  );
}

function ProdutosTab({products,refresh}){
  const [modal,setModal]=useState(null);
  const [q,setQ]=useState("");
  const filtered = products.filter(p=>(p.name+p.sku+p.category).toLowerCase().includes(q.toLowerCase()));

  const save = async form => { form.id ? await Store.updateProduct(form) : await Store.addProduct(form); setModal(null); refresh(); };
  const remove = async id => { if(confirm("Remover este produto?")){ await Store.deleteProduct(id); refresh(); } };

  return (
    <div>
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h2 className="disp text-2xl font-semibold">Produtos</h2>
        <button onClick={()=>setModal({})} className="btn-primary rounded-lg px-4 py-2 text-sm font-semibold">+ Novo produto</button>
      </div>
      <input placeholder="Buscar por nome, SKU ou categoria..." className={inputCls+" mb-4 max-w-sm"} value={q} onChange={e=>setQ(e.target.value)}/>
      <div className="card overflow-x-auto">
        <table className="w-full text-sm min-w-[640px]">
          <thead><tr className="text-left text-[#8A8680] border-b border-[var(--line)]">
            <th className="px-4 py-3 font-medium">Produto</th><th className="px-4 py-3 font-medium">SKU</th>
            <th className="px-4 py-3 font-medium">Categoria</th><th className="px-4 py-3 font-medium">Preço</th>
            <th className="px-4 py-3 font-medium">Estoque</th><th className="px-4 py-3"></th>
          </tr></thead>
          <tbody>
            {filtered.map(p=>(
              <tr key={p.id} className="border-b border-[var(--line)] last:border-0">
                <td className="px-4 py-3 font-medium">{p.name}</td>
                <td className="px-4 py-3 text-[#6B6862]">{p.sku}</td>
                <td className="px-4 py-3 text-[#6B6862]">{p.category}</td>
                <td className="px-4 py-3">{money(p.price)}</td>
                <td className="px-4 py-3">
                  <span className={"tag "+(Number(p.stock)<=0?"bg-[#FBE3E1] text-[#B3261E]":Number(p.stock)<=5?"bg-[#FBEFD9] text-[#8A5A00]":"bg-[#E1F3EA] text-[#0F7A48]")}>
                    {p.stock ?? 0} un.
                  </span>
                </td>
                <td className="px-4 py-3 text-right whitespace-nowrap">
                  <button onClick={()=>setModal(p)} className="text-[#4A6FE0] text-xs font-semibold mr-3">Editar</button>
                  <button onClick={()=>remove(p.id)} className="text-red-600 text-xs font-semibold">Remover</button>
                </td>
              </tr>
            ))}
            {filtered.length===0 && <tr><td colSpan="6" className="px-4 py-8 text-center text-[#9A968D]">Nenhum produto encontrado.</td></tr>}
          </tbody>
        </table>
      </div>
      {modal && <ProductModal initial={modal} onClose={()=>setModal(null)} onSave={save}/>}
    </div>
  );
}
function ProductModal({initial,onClose,onSave}){
  const [f,setF]=useState({name:initial.name||"",sku:initial.sku||"",description:initial.description||"",price:initial.price||"",category:initial.category||"",stock:initial.stock??0,id:initial.id});
  const set = (k,v)=>setF({...f,[k]:v});
  return (
    <Modal title={initial.id?"Editar produto":"Novo produto"} onClose={onClose}>
      <Field label="Nome do produto"><input className={inputCls} value={f.name} onChange={e=>set('name',e.target.value)}/></Field>
      <Field label="Código / SKU"><input className={inputCls} value={f.sku} onChange={e=>set('sku',e.target.value)}/></Field>
      <Field label="Categoria"><input className={inputCls} value={f.category} onChange={e=>set('category',e.target.value)}/></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Preço unitário (R$)"><input type="number" step="0.01" className={inputCls} value={f.price} onChange={e=>set('price',e.target.value)}/></Field>
        <Field label="Estoque (quantidade)"><input type="number" min="0" className={inputCls} value={f.stock} onChange={e=>set('stock',e.target.value)}/></Field>
      </div>
      <Field label="Descrição"><textarea rows="3" className={inputCls} value={f.description} onChange={e=>set('description',e.target.value)}/></Field>
      <button disabled={!f.name||!f.price} onClick={()=>onSave({...f,price:Number(f.price),stock:Number(f.stock)||0})}
        className="btn-amber w-full rounded-lg py-2.5 text-sm font-semibold mt-1 disabled:opacity-40">Salvar produto</button>
    </Modal>
  );
}

function VendedoresTab({users,refresh}){
  const [modal,setModal]=useState(null);
  const vendedores = users.filter(u=>u.role==='vendedor');
  const save = async f => {
    if(users.some(u=>u.username===f.username && u.id!==f.id)){ alert("Já existe um usuário com esse login."); return; }
    f.id ? await Store.updateUser(f) : await Store.addUser(f);
    setModal(null); refresh();
  };
  const remove = async id => { if(confirm("Remover acesso deste vendedor?")){ await Store.deleteUser(id); refresh(); } };
  return (
    <div>
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h2 className="disp text-2xl font-semibold">Vendedores</h2>
        <button onClick={()=>setModal({})} className="btn-primary rounded-lg px-4 py-2 text-sm font-semibold">+ Novo vendedor</button>
      </div>
      <div className="card divide-y divide-[var(--line)]">
        {vendedores.map(v=>(
          <div key={v.id} className="px-4 py-3 flex items-center justify-between">
            <div><p className="font-medium text-sm">{v.name}</p><p className="text-xs text-[#8A8680]">login: {v.username}</p></div>
            <div>
              <button onClick={()=>setModal(v)} className="text-[#4A6FE0] text-xs font-semibold mr-3">Editar</button>
              <button onClick={()=>remove(v.id)} className="text-red-600 text-xs font-semibold">Remover</button>
            </div>
          </div>
        ))}
        {vendedores.length===0 && <p className="px-4 py-8 text-center text-[#9A968D] text-sm">Nenhum vendedor cadastrado ainda.</p>}
      </div>
      {modal && <VendedorModal initial={modal} onClose={()=>setModal(null)} onSave={save}/>}
    </div>
  );
}
function VendedorModal({initial,onClose,onSave}){
  const [f,setF]=useState({name:initial.name||"",username:initial.username||"",password:initial.password||"",id:initial.id});
  const set=(k,v)=>setF({...f,[k]:v});
  return (
    <Modal title={initial.id?"Editar vendedor":"Novo vendedor"} onClose={onClose}>
      <Field label="Nome completo"><input className={inputCls} value={f.name} onChange={e=>set('name',e.target.value)}/></Field>
      <Field label="Login (usuário)"><input className={inputCls} value={f.username} onChange={e=>set('username',e.target.value)}/></Field>
      <Field label="Senha"><input className={inputCls} value={f.password} onChange={e=>set('password',e.target.value)}/></Field>
      <button disabled={!f.name||!f.username||!f.password} onClick={()=>onSave(f)}
        className="btn-amber w-full rounded-lg py-2.5 text-sm font-semibold mt-1 disabled:opacity-40">Salvar vendedor</button>
    </Modal>
  );
}

function PainelTab({orders,refresh}){
  const [filter,setFilter]=useState("Todos");
  const list = filter==="Todos"?orders:orders.filter(o=>o.status===filter);
  const setStatus = async (id,status) => { await Store.updateOrderStatus(id,status); refresh(); };
  const counts = STATUSES.reduce((a,s)=>({...a,[s]:orders.filter(o=>o.status===s).length}),{});

  return (
    <div>
      <h2 className="disp text-2xl font-semibold mb-5">Painel de produção</h2>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        {STATUSES.map(s=>(
          <button key={s} onClick={()=>setFilter(filter===s?"Todos":s)} className={"card p-4 text-left "+(filter===s?"ring-2 ring-[var(--amber)]":"")}>
            <p className="text-xs text-[#8A8680] mb-1">{s}</p><p className="disp text-2xl font-semibold">{counts[s]}</p>
          </button>
        ))}
      </div>
      <div className="card overflow-x-auto">
        <table className="w-full text-sm min-w-[700px]">
          <thead><tr className="text-left text-[#8A8680] border-b border-[var(--line)]">
            <th className="px-4 py-3 font-medium">Pedido</th><th className="px-4 py-3 font-medium">Cliente</th>
            <th className="px-4 py-3 font-medium">Vendedor</th><th className="px-4 py-3 font-medium">Total</th>
            <th className="px-4 py-3 font-medium">Data</th><th className="px-4 py-3 font-medium">Status</th>
          </tr></thead>
          <tbody>
            {list.slice().reverse().map(o=>(
              <tr key={o.id} className="border-b border-[var(--line)] last:border-0 align-top">
                <td className="px-4 py-3 font-mono text-xs text-[#6B6862]">#{String(o.id).slice(0,8)}</td>
                <td className="px-4 py-3 font-medium">{o.client}</td>
                <td className="px-4 py-3">{o.sellerName}</td>
                <td className="px-4 py-3">{money(o.total)}</td>
                <td className="px-4 py-3 text-[#6B6862] whitespace-nowrap">{fmtDate(o.createdAt)}</td>
                <td className="px-4 py-3">
                  <select value={o.status} onChange={e=>setStatus(o.id,e.target.value)} className="border border-[#D8D4CB] rounded-md text-xs px-2 py-1.5 bg-white">
                    {STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                </td>
              </tr>
            ))}
            {list.length===0 && <tr><td colSpan="6" className="px-4 py-8 text-center text-[#9A968D]">Nenhum pedido neste status.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function NovoPedidoTab({user,products,refresh}){
  const [client,setClient]=useState("");
  const [items,setItems]=useState([]);
  const addItem = () => setItems([...items,{productId:products[0]?.id||"",qty:1}]);
  const updItem = (i,k,v) => setItems(items.map((it,idx)=>idx===i?{...it,[k]:v}:it));
  const rmItem = i => setItems(items.filter((_,idx)=>idx!==i));
  const total = items.reduce((sum,it)=>{ const p=products.find(p=>p.id===it.productId); return sum+(p?p.price*Number(it.qty||0):0); },0);

  const submit = async () => {
    if(!client.trim() || items.length===0){ alert("Informe o cliente e ao menos um produto."); return; }
    const orderItems = items.map(it=>{ const p=products.find(p=>p.id===it.productId); return {productId:p.id,name:p.name,qty:Number(it.qty),price:p.price}; });
    const order = { sellerId:user.id, sellerName:user.name, client:client.trim(), items:orderItems, total, status:"Pendente", createdAt: now() };
    await Store.addOrder(order);
    for(const it of orderItems){
      const p = products.find(p=>p.id===it.productId);
      if(p) await Store.updateProduct({...p, stock: Math.max(0,(Number(p.stock)||0)-it.qty)});
    }
    setClient(""); setItems([]); refresh();
    alert("Pedido lançado com sucesso!");
  };

  return (
    <div className="max-w-xl">
      <h2 className="disp text-2xl font-semibold mb-5">Novo pedido</h2>
      <div className="card p-5">
        <Field label="Cliente"><input className={inputCls} placeholder="Nome do cliente" value={client} onChange={e=>setClient(e.target.value)}/></Field>
        <p className="text-sm font-medium text-[#3A3A38] mb-2">Produtos</p>
        {items.map((it,i)=>{
          const p = products.find(p=>p.id===it.productId);
          return (
            <div key={i} className="flex gap-2 mb-2 items-center">
              <select className={inputCls} value={it.productId} onChange={e=>updItem(i,'productId',e.target.value)}>
                {products.map(p=><option key={p.id} value={p.id}>{p.name} — {money(p.price)} ({p.stock ?? 0} em estoque)</option>)}
              </select>
              <input type="number" min="1" className={inputCls+" w-20"} value={it.qty} onChange={e=>updItem(i,'qty',e.target.value)}/>
              <button onClick={()=>rmItem(i)} className="text-red-600 text-lg px-1">×</button>
            </div>
          );
        })}
        <button onClick={addItem} disabled={products.length===0} className="text-sm font-semibold text-[#4A6FE0] mb-4 disabled:opacity-40">+ adicionar produto</button>
        {products.length===0 && <p className="text-xs text-[#9A968D] mb-4">Nenhum produto cadastrado ainda — peça ao administrador.</p>}
        <div className="flex items-center justify-between border-t border-[var(--line)] pt-4">
          <span className="disp text-lg font-semibold">Total: {money(total)}</span>
          <button onClick={submit} className="btn-amber rounded-lg px-5 py-2.5 text-sm font-semibold">Finalizar pedido</button>
        </div>
      </div>
    </div>
  );
}

function HistoricoTab({user,orders}){
  const mine = orders.filter(o=>o.sellerId===user.id).slice().reverse();
  return (
    <div>
      <h2 className="disp text-2xl font-semibold mb-5">Histórico de vendas</h2>
      <div className="flex flex-col gap-3">
        {mine.map(o=>(
          <div key={o.id} className="card p-4">
            <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
              <p className="font-medium">{o.client}</p>
              <StatusTag s={o.status}/>
            </div>
            <ul className="text-sm text-[#6B6862] mb-2">
              {o.items.map((it,i)=><li key={i}>{it.qty}× {it.name} — {money(it.price*it.qty)}</li>)}
            </ul>
            <div className="flex items-center justify-between text-sm">
              <span className="text-[#8A8680]">{fmtDate(o.createdAt)}</span>
              <span className="font-semibold">{money(o.total)}</span>
            </div>
          </div>
        ))}
        {mine.length===0 && <p className="text-center text-[#9A968D] py-10 text-sm">Você ainda não lançou nenhum pedido.</p>}
      </div>
    </div>
  );
}

function App(){
  const [db,setDb] = useState({users:[],products:[],orders:[]});
  const [loading,setLoading] = useState(true);
  const [user,setUser] = useState(null);
  const [tab,setTab] = useState(null);

  const refresh = async () => { const fresh = await Store.loadAll(); setDb(fresh); };
  useEffect(()=>{ refresh().then(()=>setLoading(false)); },[]);

  if(loading) return <div className="min-h-screen flex items-center justify-center text-[#8A8680] text-sm" style={{background:"var(--ink)"}}>Carregando...</div>;

  if(!user) return <Login users={db.users} onLogin={u=>{setUser(u); setTab(u.role==='admin'?'produtos':'novo');}}/>;

  if(user.role==='admin'){
    const tabs=[{key:'produtos',label:'Produtos'},{key:'vendedores',label:'Vendedores'},{key:'painel',label:'Painel de produção'}];
    return (
      <Shell user={user} tabs={tabs} active={tab} setActive={setTab} onLogout={()=>setUser(null)}>
        {tab==='produtos' && <ProdutosTab products={db.products} refresh={refresh}/>}
        {tab==='vendedores' && <VendedoresTab users={db.users} refresh={refresh}/>}
        {tab==='painel' && <PainelTab orders={db.orders} refresh={refresh}/>}
      </Shell>
    );
  }
  const tabs=[{key:'novo',label:'Novo pedido'},{key:'historico',label:'Histórico'}];
  return (
    <Shell user={user} tabs={tabs} active={tab} setActive={setTab} onLogout={()=>setUser(null)}>
      {tab==='novo' && <NovoPedidoTab user={user} products={db.products} refresh={refresh}/>}
      {tab==='historico' && <HistoricoTab user={user} orders={db.orders}/>}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
